<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

 </head>
<body>
    <div class="container-fluid"  style="padding-left: 0!important; padding-right: 0!important;">
         
        <nav class="navbar navbar-expand-lg bg-dark " data-bs-theme="dark">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Navbar</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                
                </div>
              </div>
            </div>
          </nav>

          <main class="container-fluid ">
            <div class="row" style="padding-right: 1.5%;">
                <div class="d-flex justify-content-end ">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#adicionar-filme">
                        Adicionar Filme
                      </button>
                </div>
              </div>
    
              <div class="row p-5" > 
                <table class="table">
                    <thead class="table-dark">
                        <th>id</th>
                        <th>Titulo</th>
                        <th>Gênero</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </thead>
                    <tbody>
                        <tr>
                            <th>1</th>
                            <th>Inter</th>
                            <th>ação</th>
                            <th><p class="bg-success rounded-3">completo</p></th>
                            <th>
                                <button class="btn btn-outline-primary">Editar</button>
                                <button class="btn btn-outline-danger">Editar</button>
                            </th>
                        </tr>
                        <tr>
                            <th>2</th>
                            <th>center</th>
                            <th>drama</th>
                            <th><p class="bg-success rounded-3">completo</p></th>
                            <th>
                                <button class="btn btn-outline-primary">Editar</button>
                                <button class="btn btn-outline-danger">Editar</button>
                            </th>
                        </tr>
                        <tr>
                            <th>3</th>
                            <th>left</th>
                            <th>ação</th>
                            <th ><p class="bg-warning rounded-3">andamento</p></th>
                            <th>
                                <button class="btn btn-outline-primary">Editar</button>
                                <button class="btn btn-outline-danger">Editar</button>
                            </th>
                        </tr>
                    </tbody>
                </table>
              </div>
          </main>
    </div>
    <div class="modal fade" id="adicionar-filme" tabindex="-1" aria-labelledby="adicionar-filmeLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="adicionar-filmeLabel">Cadastre um filme</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
             <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input name="nome" class="form-control">
             </div>

              <select class="form-select"> 
                <option>Ação</option>
                <option>Drama</option>
                <option>Comédia</option>
                <option>Outros</option>
              </select>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary">Save changes</button>
            </div>
          </div>
        </div>
      </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
