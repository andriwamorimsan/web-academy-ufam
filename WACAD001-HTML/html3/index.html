<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

   <style>
    .padrao{
      border-radius: 25px;
       text-align: center;
    }
    
    .header{
     background-color: #ff788f; 
    }
    
    .nav-1{
      background-color: #45e0a8;
    }
    .aside{
      background-color: #facfd6;
    }
    
    .main{
      background-color: #c9edff;
      padding-bottom: 10px;
    }
    .remove_margin{
      margin-left: 0!important;

      padding-left: 0!important;
      padding-right: 0!important;
    }
    .article{
      background-color:#6edbff ;

      margin-right: 5%;

    .figure{
      background-color: #fff2b5;
        padding: 0 20%  0 20%;
    }
    .pp{
      background-color: #edffa8;
      margin-left: 12%;
      margin-right: 12%;
       
    }
    .section{
      background-color: #00a8ff;
      margin-top: 10px;
     
            margin-left: 6%;
      margin-right: 6%;
    }
    
    .footer{
      background-color: #b880ff;
      
    }

       height: 100%;
       align-content: center;
     }

  </head>

      <div class="container-fluid remove_margin">

      </nav>
      
       <div class="row">

                </aside>
            </div>

            <main class="main padrao p-3">
             <h3>< main  ></h3>

               <h3>< article ></h3>
               
               <figure class="figure padrao">
                 <h3>< figure ></h3>
               </figure>
               
               <div class="pp padrao"><h3 >< p ></h3></div>
                 
             </article>
             <section class="section padrao p-3">
             <h3>  < section ></h3>
             </section>
           </main>
       </div>
       
       </div>
       
       
       <footer class="footer mt-2 p-3 padrao">
         <h1>< footer  ></h1>
       </footer>
       
      
      <script src="script.js"></script>
