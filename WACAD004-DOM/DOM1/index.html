<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compra</title>
  </head>  
    <body>
      <div id="resumo-carrinho">
        <h2>Fechamento do Pedido</h2>
        
        <!-- Valores que o JS precisa ler -->
        <label>Subtotal dos Produtos (R$):</label>
        <input type="number" id="valor-subtotal" value="150.00">
        <br><br>

        <label>Valor do Frete (R$):</label>
        <input type="number" id="valor-frete" value="25.50">
        <br><br>

        <!-- Lista para ser contada -->
        <h3>Itens na sua caixa:</h3>
        <ul id="lista-produtos">
          <li class="produto-comprado">Camiseta Básica Preta</li>
          <li class="produto-comprado">Calça Jeans Tradicional</li>
          <li class="produto-comprado">Par de Meias Brancas</li>
        </ul>
      </div>
    </body>

    <script>
      // Função para calcular o valor total do pedido
      function calcularValorTotal() {
        // Ler os valores do subtotal e do frete
        const valorSubtotal = parseFloat(document.getElementById('valor-subtotal').value);
        const valorFrete = parseFloat(document.getElementById('valor-frete').value);

        // Contar o número de produtos comprados
        const listaProdutos = document.getElementById('lista-produtos');
        const numeroProdutos = listaProdutos.getElementsByClassName('produto-comprado').length;

        // Calcular o valor total
        const valorTotal = valorSubtotal + valorFrete;

        // Exibir o resultado
        alert(`Quantidade de itens na caixa: ${numeroProdutos}\nValor Total do Pedido: R$ ${valorSubtotal.toFixed(2)}\nFrete: R$ ${valorFrete.toFixed(2)}\nValor Total do Pedido+frete: R$ ${valorTotal.toFixed(2)}`);
      }

      // Chamar a função para calcular o valor total quando a página carregar
      window.onload = calcularValorTotal;
    </script>
</html>
