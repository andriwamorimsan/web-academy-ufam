<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
  </head>
  <body>
    <div id="organizador">
      <h3>Tarefas Pendentes:</h3>
      <ul id="lista-pendentes">
        <li id="tarefa-carro">Lavar o carro</li>
        <li id="tarefa-js">Estudar JavaScript</li>
        <li id="tarefa-livro">Ler livro</li>
        <li id="tarefa-roupas">Dobrar as roupas</li>
      </ul>

      <h3>Tarefas Concluídas:</h3>
      <ul id="lista-concluidas">
        <li>Fazer compras</li>
      </ul>
    </div>

    <script>
        const tarefaJs = document.getElementById("tarefa-js").firstElementChild;
        const tarefaCarro = document.getElementById("lista-pendentes").firstElementChild;
        const tarefaLivro = document.getElementById("tarefa-roupas").previousElementSibling;


        const listaConcluidas = document.getElementById("lista-concluidas").firstElementChild;

        
        tarefaCarro.remove();
 
        tarefaLivro.innerText = "[URGENTE] " + tarefaLivro.innerText;

        const irmaoAnterior = document.createElement("li")
        irmaoAnterior.innerText = "Estudar JavaScript";

        listaConcluidas.insertAdjacentElement("afterend", irmaoAnterior);

        tarefaJs.remove();



    </script>
  </body>
</html>
