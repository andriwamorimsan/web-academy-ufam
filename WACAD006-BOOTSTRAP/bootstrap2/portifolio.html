<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineList</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">CineList</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav">
                <a class="nav-link" href="#">Dashboard</a>
                <a class="nav-link active" href="#">Catálogo</a>
                <a class="nav-link" href="#">Usuários</a>
            </div>

            <div class="ms-auto">
                <a href="#" class="nav-link text-white" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">Menu</a>
            </div>
        </div>
    </div>
</nav>

<main class="container mt-5 pt-5">
    <div class="d-flex justify-content-end mb-4">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#adicionarFilme">Adicionar Filme</button>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle text-center">

            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Gênero</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr>
                <td>1</td>
                <td>Interestelar</td>
                <td>Ficção Científica</td>
                <td>
                    <span class="badge bg-success">Assistido</span>
                </td>
                <td>
                    <button class="btn btn-outline-primary btn-sm">Editar</button>

                    <button class="btn btn-outline-danger btn-sm">Excluir</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Clube da Luta</td>
                <td>Drama</td>
                <td>
                    <span class="badge bg-warning text-dark">Pendente</span>
                </td>
                <td>
                    <button class="btn btn-outline-primary btn-sm">
                        Editar
                    </button>

                    <button class="btn btn-outline-danger btn-sm">
                        Excluir
                    </button>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>Batman</td>
                <td>Ação</td>
                <td>
                    <span class="badge bg-success">Assistido</span>
                </td>
                <td>
                    <button class="btn btn-outline-primary btn-sm">
                        Editar
                    </button>

                    <button class="btn btn-outline-danger btn-sm">
                        Excluir
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div class="modal fade" id="adicionarFilme" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Cadastrar Filme</h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Nome do Filme</label>

                    <input type="text" class="form-control" placeholder="Digite o nome do filme">
                </div>

                <div class="mb-3">
                    <label class="form-label">Gênero</label>

                    <select class="form-select">
                        <option>Ação</option>
                        <option>Drama</option>
                        <option>Comédia</option>
                        <option>Ficção</option>
                        <option>Terror</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Ano</label>
                    <input type="number" class="form-control" placeholder="2026">
                </div>
                <div class="mb-3">
                    <label class="form-label">
                        Resumo
                    </label>
                    <textarea class="form-control" rows="4" placeholder="Resumo do filme"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Fechar
                </button>
                <button class="btn btn-primary">
                    Salvar Filme
                </button>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="menuLateral">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Menu</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas">
        </button>
    </div>
    <div class="offcanvas-body">
        <div class="list-group">
            <a href="#" class="list-group-item list-group-item-action active">Dashboard</a>
            <a href="#" class="list-group-item list-group-item-action">Catálogo de Filmes</a>
            <a href="#" class="list-group-item list-group-item-action">Gestão de Usuários</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
